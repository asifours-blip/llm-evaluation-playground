name: deepseek-v4-flash-pilot
mode: live
dataset_path: data/eval/rag_quality_v1.json
knowledge_base_path: data/knowledge_base
database_path: .ragql/experiments.sqlite3
artifact_dir: artifacts/live-deepseek-pilot
pricing_path: pricing/deepseek-2026-08-21.yaml
random_seed: 42
max_workers: 2
provider:
  name: deepseek
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
  chat_model: deepseek-v4-flash
  embedding_model: fake-hash-256
  timeout_seconds: 90
  max_retries: 2
retrieval:
  - {chunk_size: 300, chunk_overlap: 50, top_k: 4, prompt_variant: evidence_first}
  - {chunk_size: 600, chunk_overlap: 50, top_k: 4, prompt_variant: evidence_first}
budget:
  currency: CNY
  hard_limit: 20
  preflight_fraction: 0.90
  safety_multiplier: 1.25

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-quality-lab"
version = "0.2.0"
description = "Reproducible evaluation for LLM and RAG systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]

[project.scripts]
rag-quality = "rag_quality_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_quality_lab = ["py.typed", "reporting/templates/*.jinja2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests crossing package or persistence boundaries",
    "live: tests requiring paid external model APIs",
]

[tool.coverage.run]
branch = true
source = ["rag_quality_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag_quality_lab"]
mypy_path = "src"
explicit_package_bases = true
